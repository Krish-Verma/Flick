name: Flick Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flick-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  media-workflow:
    name: Real synthetic media workflow (no recording hardware)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
      FLICK_HARDWARE_TESTS: '0'
      FLICK_MEDIA_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - name: Restore verified media runtimes
        shell: pwsh
        run: ./scripts/setup_tools.ps1
      - name: Exercise real trim, audio, export, validation and cancellation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:FLICK_TEST_FFMPEG = Join-Path (Get-Location) 'tools\ffmpeg\ffmpeg.exe'
          $env:FLICK_TEST_FFPROBE = Join-Path (Get-Location) 'tools\ffmpeg\ffprobe.exe'
          $env:FLICK_TEST_FFMPEG_VERSION = ((Get-Content dependencies.lock.json -Raw | ConvertFrom-Json).pinnedDependencies.ffmpeg.version -split '-')[0]
          $env:FLICK_MEDIA_OUTPUT_DIR = Join-Path (Get-Location) 'MediaTestResults\fixtures'
          dotnet test tests/LocalClip.Core.Tests/LocalClip.Core.Tests.csproj -c Release `
            --filter 'FullyQualifiedName~MediaWorkflowTests' `
            --logger 'trx;LogFileName=media-workflow.trx' --results-directory MediaTestResults
          if ($LASTEXITCODE -ne 0) { throw 'Real media workflow tests failed' }
          [xml]$report = Get-Content 'MediaTestResults/media-workflow.trx' -Raw
          $ns = [Xml.XmlNamespaceManager]::new($report.NameTable)
          $ns.AddNamespace('t','http://microsoft.com/schemas/VisualStudio/TeamTest/2010')
          $counter = $report.SelectSingleNode('/t:TestRun/t:ResultSummary/t:Counters',$ns)
          $cases = @($report.SelectNodes('/t:TestRun/t:Results/t:UnitTestResult',$ns))
          if ($null -eq $counter -or [int]$counter.total -ne 5 -or [int]$counter.executed -ne 5 -or
              [int]$counter.passed -ne 5 -or [int]$counter.failed -ne 0 -or [int]$counter.notExecuted -ne 0 -or
              $cases.Count -ne 5 -or @($cases | Where-Object outcome -ne 'Passed').Count -ne 0) {
            throw 'Exactly five real media tests must execute and pass; skipped tests are not acceptance.'
          }
      - name: Record exact FFmpeg build configuration
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory MediaTestResults -Force | Out-Null
          if (Test-Path tools/ffmpeg/ffmpeg.exe) {
            & tools/ffmpeg/ffmpeg.exe -version 2>&1 | Set-Content MediaTestResults/ffmpeg-version.txt
            & tools/ffmpeg/ffmpeg.exe -buildconf 2>&1 | Set-Content MediaTestResults/ffmpeg-buildconf.txt
            & tools/ffmpeg/ffmpeg.exe -L 2>&1 | Set-Content MediaTestResults/ffmpeg-license.txt
            Get-FileHash tools/ffmpeg/ffmpeg.exe,tools/ffmpeg/ffprobe.exe -Algorithm SHA256 |
              Format-List | Out-String | Set-Content MediaTestResults/ffmpeg-hashes.txt
          }
      - name: Upload synthetic media test receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flick-real-media-workflow
          path: MediaTestResults/
          if-no-files-found: error
          retention-days: 30

  encoder-policy:
    name: Encoder negotiation policy (no GPU required)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile and exercise cross-vendor selection and bounded CPU policy
        run: |
          mkdir -p native-policy-ci
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Isrc/LocalClip.CaptureHost \
            tests/LocalClip.CaptureHost.Tests/encoder_policy_tests.cpp \
            -o native-policy-ci/encoder-policy-tests
          native-policy-ci/encoder-policy-tests
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            tests/LocalClip.CaptureHost.Tests/audio_policy_tests.cpp \
            -o native-policy-ci/audio-policy-tests
          native-policy-ci/audio-policy-tests

  dotnet:
    name: WPF build and hardware-independent tests
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      FLICK_HARDWARE_TESTS: '0'
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - name: Restore solution
        run: dotnet restore LocalClip.slnx
      - name: Audit direct and transitive NuGet dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = dotnet list LocalClip.slnx package --vulnerable --include-transitive --format json --output-version 1 --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'NuGet vulnerability audit could not complete' }
          New-Item -ItemType Directory TestResults -Force | Out-Null
          $json = $output -join [Environment]::NewLine
          $json | Set-Content TestResults/nuget-audit.json -Encoding utf8
          $audit = $json | ConvertFrom-Json
          if ($audit.version -ne 1 -or @($audit.projects).Count -eq 0 -or
              @($audit.logs | Where-Object level -in @('Warning','Error')).Count -gt 0) {
            throw 'NuGet audit returned incomplete results or warnings/errors.'
          }
          foreach ($project in $audit.projects) {
            foreach ($framework in $project.frameworks) {
              foreach ($package in @($framework.topLevelPackages) + @($framework.transitivePackages)) {
                if ($null -ne $package -and @($package.vulnerabilities).Count -gt 0) {
                  throw "Known vulnerable dependency: $($package.id) $($package.resolvedVersion)"
                }
              }
            }
          }
      - name: Validate PowerShell script syntax
        shell: pwsh
        run: |
          Get-ChildItem scripts -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "PowerShell syntax failed: $($_.Name) — $errors" }
          }
      - name: Validate reusable GUI tokens and logo chrome
        shell: pwsh
        run: ./scripts/check_gui_design.ps1
      - name: Validate Slice 2 shell and notification contract
        shell: pwsh
        run: ./scripts/check_gui_slice2.ps1
      - name: Validate Slice 3 library and import contracts
        shell: pwsh
        run: ./scripts/check_gui_slice3.ps1
      - name: Validate Slice 4 player/trim/audio contracts
        shell: pwsh
        run: ./scripts/check_gui_slice4.ps1
      - name: Validate Slice 5 sharing and grouped settings contract
        shell: pwsh
        run: ./scripts/check_gui_slice5.ps1
      - name: Validate Slice 6 adaptive layout and contrast
        shell: pwsh
        run: ./scripts/check_gui_slice6.ps1
      - name: Validate GUI Refresh R1 single-window navigation
        shell: pwsh
        run: ./scripts/check_gui_refresh_r1.ps1
      - name: Validate GUI Refresh R2 native title bar, logo and themed menus
        shell: pwsh
        run: ./scripts/check_gui_refresh_r2.ps1
      - name: Validate complete R3-R8 workspace and banner privacy
        shell: pwsh
        run: ./scripts/check_gui_refresh_final.ps1
      - name: Verify release packaging and memory source contracts
        shell: pwsh
        run: ./scripts/check_flick_release_source.ps1
      - name: Build solution (Release)
        run: dotnet build LocalClip.slnx --configuration Release --no-restore --warnaserror
      - name: Run hardware-independent tests
        run: dotnet test LocalClip.slnx --configuration Release --no-build --logger "trx" --results-directory TestResults
      - name: Build isolated recording harness and exercise safe refusals
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -Path scripts/RecordingHarnessSession.cs
          dotnet build tools/Flick.RecordingHarness/Flick.RecordingHarness.csproj -c Release --warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Recording harness build failed' }
          $receipt = Join-Path (Get-Location) 'TestResults/recording-harness-self-check.json'
          dotnet run --project tools/Flick.RecordingHarness/Flick.RecordingHarness.csproj -c Release --no-build -- --self-check --receipt $receipt
          if ($LASTEXITCODE -ne 0) { throw 'Recording harness safe self-check failed' }
          $checks = Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
          if (-not $checks.Accepted -or $checks.Expected -ne 20 -or $checks.Executed -ne 20 -or
              $checks.Passed -ne 20 -or $checks.Failed -ne 0 -or $checks.Skipped -ne 0 -or
              @($checks.Cases).Count -ne 20 -or @($checks.Cases | Where-Object Passed -ne $true).Count -ne 0) {
            throw 'All twenty non-capture harness checks must execute and pass.'
          }
          dotnet run --project tools/Flick.RecordingHarness/Flick.RecordingHarness.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 2) { throw 'Harness must refuse capture without explicit arguments and opt-in' }
          exit 0 # The expected refusal is the assertion; do not propagate its exit2 as a CI failure.
      - name: Build generated-process audio harness and exercise no-argument refusal
        shell: pwsh
        run: |
          dotnet build tools/Flick.AudioQualification/Flick.AudioQualification.csproj -c Release --warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Audio qualification harness build failed' }
          dotnet run --project tools/Flick.AudioQualification/Flick.AudioQualification.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 2) { throw 'Audio harness must refuse playback/capture without explicit arguments' }
          exit 0
      - name: Smoke-check self-contained Windows publish
        run: dotnet publish src/LocalClip.App/LocalClip.App.csproj -c Release -r win-x64 --self-contained true -o publish-smoke --nologo
      - name: Validate branded published app and generated icon
        shell: pwsh
        run: |
          if (-not (Test-Path publish-smoke/Flick.exe)) {
            throw "Self-contained WPF publish did not create Flick.exe"
          }
          if (-not (Test-Path src/LocalClip.App/Assets/Brand/Flick.ico)) {
            throw "Embedded Flick icon was not generated"
          }
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flick-unit-test-results
          path: TestResults/**
          if-no-files-found: warn

  native:
    name: Compile native libobs host (no GPU required)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
      - name: Download verified pinned OBS runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/obsproject/obs-studio/releases/download/32.2.2/OBS-Studio-32.2.2-Windows-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP/obs.zip"
          $actual = (Get-FileHash "$env:RUNNER_TEMP/obs.zip" -Algorithm SHA256).Hash
          $expected = "4D6E40E3AB155F56B30DE517380566A206D74B63CDF5AD49AA596924768F97E1"
          if ($actual -ne $expected) { throw "OBS archive hash mismatch" }
          New-Item -ItemType Directory -Path tools/obs/runtime -Force | Out-Null
          Expand-Archive -Path "$env:RUNNER_TEMP/obs.zip" -DestinationPath tools/obs/runtime -Force
          if (-not (Test-Path tools/obs/runtime/bin/64bit/obs.dll)) {
            throw "Missing obs.dll after OBS runtime extraction"
          }
      - name: Compile native host with MinGW-w64
        shell: msys2 {0}
        run: |
          mkdir -p native-ci
          g++ --version
          windres -Isrc/LocalClip.CaptureHost src/LocalClip.CaptureHost/nativeversion.rc -O coff -o native-ci/capture-version.o
          g++ -O2 -std=c++17 -static-libgcc -static-libstdc++ \
            -Itools/obs/include/libobs -Isrc/LocalClip.CaptureHost \
            src/LocalClip.CaptureHost/main.cpp native-ci/capture-version.o \
            -Ltools/obs/runtime/bin/64bit -Wl,-Bstatic -lwinpthread \
            -Wl,-Bdynamic -lobs -ldwmapi -lole32 -o native-ci/LocalClip.CaptureHost.exe
      - name: Confirm native executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path native-ci/LocalClip.CaptureHost.exe)) {
            throw "Native host compile did not produce an executable"
          }

# Native CI compiles the capture host; it does not perform real GPU/CPU
# recording, real audio capture, game FPS checks, portable GUI launch,
# Discord drag/paste or long-duration soaks. These require owner hardware.

