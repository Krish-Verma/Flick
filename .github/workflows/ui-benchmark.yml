name: Matched synthetic WPF diagnostics
on:
  pull_request:
    paths:
      - 'src/LocalClip.App/**'
      - 'src/LocalClip.Core/**'
      - 'tests/**'
      - 'tools/Flick.UiBenchmark/**'
      - 'scripts/run_ui_benchmark.ps1'
      - '.github/workflows/ui-benchmark.yml'
  workflow_dispatch:
    inputs:
      sample_seconds:
        description: 'Idle samples per fresh process; 300 runs the full five-minute synthetic protocol'
        type: choice
        options: ['15', '30', '300']
        default: '15'
permissions:
  contents: read
jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: ${{ inputs.sample_seconds == '300' && 180 || 30 }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - name: Check out pinned baseline
        uses: actions/checkout@v4
        with:
          ref: '49844256bf5f160b4777d0fa057cd79ddcf27eaf'
          path: baseline
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - name: Compare identical synthetic fixtures
        shell: pwsh
        env:
          BENCHMARK_SAMPLE_SECONDS: ${{ inputs.sample_seconds || '15' }}
        run: |
          ./candidate/scripts/run_ui_benchmark.ps1 `
            -BaselineCheckout (Join-Path $env:GITHUB_WORKSPACE 'baseline') `
            -CandidateCheckout (Join-Path $env:GITHUB_WORKSPACE 'candidate') `
            -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'ui-benchmark') `
            -SampleSeconds ([int]$env:BENCHMARK_SAMPLE_SECONDS)
      - name: Retain raw observations and diagnostic comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flick-matched-synthetic-wpf-diagnostics
          path: ui-benchmark/
          if-no-files-found: error
          retention-days: 7
