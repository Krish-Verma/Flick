name: Render Flick WPF interface
on:
  pull_request:
    paths:
      - 'tools/Flick.UiRender/**'
      - '.github/workflows/render-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - name: Render real WPF controls with synthetic fixtures
        run: dotnet run --project tools/Flick.UiRender/Flick.UiRender.csproj -c Release -- ui-render
      - name: Upload rendered client-area images and provenance
        uses: actions/upload-artifact@v4
        with:
          name: flick-wpf-ui-render
          path: ui-render/
          if-no-files-found: error
          retention-days: 7
