name: Publish Private Flick Preview to Releases

on:
  push:
    branches: [main]
    paths:
      - 'release/preview-version.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flick-publish-preview-release
  cancel-in-progress: false

jobs:
  setup-preview:
    name: Build and verify Windows preview binaries
    if: github.repository == 'Krish-Verma/Flick' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 65
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
      - name: Install reviewed Inno Setup 6.7.1 compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --version=6.7.1 --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup Chocolatey install failed" }
          $programFiles = [Environment]::GetFolderPath([Environment+SpecialFolder]::ProgramFilesX86)
          $iscc = Join-Path $programFiles 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw "ISCC.exe missing after pinned installation" }
      - name: Download and SHA-256 verify OBS and FFmpeg runtime assets
        shell: pwsh
        run: ./scripts/setup_tools.ps1
      - name: Build native capture host in qualified MSYS2 environment
        shell: msys2 {0}
        run: |
          test -f tools/obs/runtime/bin/64bit/obs.dll
          g++ -O2 -std=c++17 -static-libgcc -static-libstdc++ \
            -Itools/obs/include/libobs -Isrc/LocalClip.CaptureHost \
            src/LocalClip.CaptureHost/main.cpp \
            -Ltools/obs/runtime/bin/64bit -Wl,-Bstatic -lwinpthread \
            -Wl,-Bdynamic -lobs -ldwmapi \
            -o tools/obs/runtime/bin/64bit/LocalClip.CaptureHost.exe
          test -f tools/obs/runtime/bin/64bit/LocalClip.CaptureHost.exe
      - name: Run offline source/design contracts
        shell: pwsh
        run: |
          ./scripts/check_gui_design.ps1
          ./scripts/check_gui_slice6.ps1
          ./scripts/check_flick_release_source.ps1
      - name: Verify .NET Release build and offline regression tests
        shell: pwsh
        run: |
          dotnet restore LocalClip.slnx
          if ($LASTEXITCODE -ne 0) { throw "Restore failed" }
          dotnet build LocalClip.slnx -c Release --warnaserror --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }
          ./scripts/run_tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "Offline tests failed" }
      - name: Build portable ZIP and conventional per-user Setup EXE
        shell: pwsh
        run: ./scripts/build_installer.ps1 -SkipNativeBuild
      - name: Check actual SHA-256 values, bundled runtimes, and version
        shell: pwsh
        run: ./scripts/verify_flick_release.ps1
      - name: Upload PRIVATE preview files for authorized tester
        uses: actions/upload-artifact@v4
        with:
          name: flick-preview-release-files
          path: |
            dist/Flick-Setup.exe
            dist/Flick-v1.0.2-win-x64.zip
            dist/SHA256SUMS.txt
            release/PREVIEW-RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 14


  publish-private-prerelease:
    name: Publish direct-click Windows Setup EXE on GitHub Releases
    needs: setup-preview
    if: github.repository == 'Krish-Verma/Flick' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flick-preview-release-files
          path: release-files
      - name: Guard repository privacy, inputs and existing tags
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $isPrivate = gh api "repos/$env:GH_REPO" --jq '.private'
          if ($LASTEXITCODE -ne 0 -or $isPrivate.Trim() -ne 'true') {
            throw "Refusing to publish preview release while repository is public"
          }
          # upload-artifact preserves common directory roots (dist/ and
          # release/). Normalize defensively; reject duplicate/missing files.
          New-Item -ItemType Directory -Force -Path 'release-ready' | Out-Null
          $candidates = @(Get-ChildItem -LiteralPath 'release-files' -File -Recurse)
          foreach ($f in @('Flick-Setup.exe','Flick-v1.0.2-win-x64.zip','SHA256SUMS.txt','PREVIEW-RELEASE-NOTES.md')) {
            $matches = @($candidates | Where-Object { $_.Name -eq $f })
            if ($matches.Count -ne 1) {
              throw "Expected exactly one release asset named $f but got $($matches.Count)"
            }
            Copy-Item -LiteralPath $matches[0].FullName -Destination (Join-Path 'release-ready' $f) -Force
          }
          $manifest = Get-Content -LiteralPath 'release-ready/SHA256SUMS.txt' -Raw
          foreach ($filename in @('Flick-Setup.exe','Flick-v1.0.2-win-x64.zip')) {
            $actual = (Get-FileHash -LiteralPath (Join-Path 'release-ready' $filename) -Algorithm SHA256).Hash
            if (-not $manifest.Contains("$actual  $filename")) {
              throw "Downloaded artifact SHA-256 does not match manifest: $filename"
            }
          }
          # Listing releases is a successful API call even when this tag is
          # absent; avoid terminating PowerShell on a 404 from release view.
          $existing = @(gh release list --repo $env:GH_REPO --limit 100 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0) { throw "Failed to inspect existing GitHub releases" }
          if ($existing -contains 'v1.0.2-preview.2') {
            throw "This prerelease already exists; refusing to modify its assets"
          }
      - name: Create PRIVATE prerelease with one-click Setup EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $argsList = @(
            'release', 'create', 'v1.0.2-preview.2',
            'release-ready/Flick-Setup.exe#Windows installer (double-click)',
            'release-ready/Flick-v1.0.2-win-x64.zip#Portable ZIP',
            'release-ready/SHA256SUMS.txt#SHA-256 checksums',
            '--repo', $env:GH_REPO,
            '--target', $env:GITHUB_SHA,
            '--title', 'Flick v1.0.2 — Windows NVIDIA NVENC Preview 2',
            '--notes-file', 'release-ready/PREVIEW-RELEASE-NOTES.md',
            '--prerelease', '--latest=false'
          )
          & gh @argsList
          if ($LASTEXITCODE -ne 0) { throw "GitHub prerelease creation failed" }
          Write-Host "Flick preview release published privately on GitHub Releases."

# The private preview is NOT a public/stable release. It is created only from
# main after the reviewed version marker changes, never from untrusted PR code.
