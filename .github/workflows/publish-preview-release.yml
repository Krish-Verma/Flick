name: LEGACY unsigned preview builder (manual test only)

# Former auto-publisher intentionally disabled while Smart App Control
# rejects our unsigned installer. Use signed-windows-qa.yml with a Public
# Trust signing identity instead; do not mark unsigned bits public/stable.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flick-publish-preview-release
  cancel-in-progress: false

jobs:
  setup-preview:
    name: Build and verify Windows preview binaries
    if: github.repository == 'Krish-Verma/Flick' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 65
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
      - name: Install reviewed Inno Setup 6.7.1 compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --version=6.7.1 --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup Chocolatey install failed" }
          $programFiles = [Environment]::GetFolderPath([Environment+SpecialFolder]::ProgramFilesX86)
          $iscc = Join-Path $programFiles 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw "ISCC.exe missing after pinned installation" }
      - name: Download and SHA-256 verify OBS and FFmpeg runtime assets
        shell: pwsh
        run: ./scripts/setup_tools.ps1
      - name: Build native capture host in qualified MSYS2 environment
        shell: msys2 {0}
        run: |
          test -f tools/obs/runtime/bin/64bit/obs.dll
          mkdir -p native-build
          windres -Isrc/LocalClip.CaptureHost src/LocalClip.CaptureHost/nativeversion.rc -O coff -o native-build/capture-version.o
          g++ -O2 -std=c++17 -static-libgcc -static-libstdc++ \
            -Itools/obs/include/libobs -Isrc/LocalClip.CaptureHost \
            src/LocalClip.CaptureHost/main.cpp native-build/capture-version.o \
            -Ltools/obs/runtime/bin/64bit -Wl,-Bstatic -lwinpthread \
            -Wl,-Bdynamic -lobs -ldwmapi -lole32 \
            -o tools/obs/runtime/bin/64bit/LocalClip.CaptureHost.exe
          test -f tools/obs/runtime/bin/64bit/LocalClip.CaptureHost.exe
      - name: Run offline source/design contracts
        shell: pwsh
        run: |
          ./scripts/check_gui_design.ps1
          ./scripts/check_gui_slice6.ps1
          ./scripts/check_flick_release_source.ps1
      - name: Verify .NET Release build and offline regression tests
        shell: pwsh
        run: |
          dotnet restore LocalClip.slnx
          if ($LASTEXITCODE -ne 0) { throw "Restore failed" }
          dotnet build LocalClip.slnx -c Release --warnaserror --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }
          ./scripts/run_tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "Offline tests failed" }
      - name: Build portable ZIP and conventional per-user Setup EXE
        shell: pwsh
        run: ./scripts/build_installer.ps1 -SkipNativeBuild
      - name: Check actual SHA-256 values, bundled runtimes, and version
        shell: pwsh
        run: ./scripts/verify_flick_release.ps1
      - name: Upload PRIVATE preview files for authorized tester
        uses: actions/upload-artifact@v4
        with:
          name: flick-preview-release-files
          path: |
            dist/Flick-Setup.exe
            dist/Flick-v1.0.5-win-x64.zip
            dist/SHA256SUMS.txt
            release/PREVIEW-RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 14


# Intentional end of workflow: only upload private unsigned CI evidence.
# No job in this file may create tags, releases, or publicly downloadable EXEs.
