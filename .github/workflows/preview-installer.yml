name: Flick Unsigned Windows Setup Preview

on:
  pull_request:
    paths:
      - 'src/LocalClip.App/**'
      - 'src/LocalClip.Core/**'
      - 'src/LocalClip.CaptureHost/**'
      - 'tools/Flick.RecordingHarness/**'
      - 'tools/Flick.AudioQualification/**'
      - 'installer/**'
      - 'scripts/build_*.ps1'
      - 'scripts/setup_tools.ps1'
      - 'scripts/check_obs_runtime.ps1'
      - 'scripts/check_capture_host_runtime.ps1'
      - 'scripts/test_flick_installer_update.ps1'
      - 'scripts/check_ffmpeg_runtime.ps1'
      - 'scripts/run_recording_qualification.ps1'
      - 'scripts/RecordingHarnessSession.cs'
      - 'dependencies.lock.json'
      - 'scripts/verify_flick_release.ps1'
      - '.github/workflows/preview-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flick-preview-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch-preserved-upgrade-fixture:
    name: Fetch preserved upgrade fixture (same repository or owner only)
    # GitHub requires push visibility for draft assets. This isolated job has
    # no checkout and runs only a fixed GET/hash gate, never PR-supplied code.
    # Fork PRs intentionally skip installer qualification and package output.
    if: github.repository == 'Krish-Verma/Flick' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner))
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch only the immutable baseline asset and verify its bytes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 or newer is required for byte-preserving native redirection' }
          $directory = Join-Path $env:RUNNER_TEMP 'flick-upgrade-fixture'
          New-Item -ItemType Directory $directory -Force | Out-Null
          $baseline = Join-Path $directory 'Flick-1.0.4-Setup.exe'
          gh api repos/Krish-Verma/Flick/releases/assets/669859579 -H 'Accept: application/octet-stream' > $baseline
          if (-not (Test-Path -LiteralPath $baseline -PathType Leaf) -or
              (Get-Item -LiteralPath $baseline).Length -ne 241947803 -or
              (Get-FileHash -LiteralPath $baseline -Algorithm SHA256).Hash -cne 'DA1A0BBFB6B1D5803FC0D54387682C24F43D6039BAE6A2C999822628E7828A5F') {
            throw 'Preserved Flick 1.0.4 upgrade fixture is missing or its bytes changed'
          }
      - name: Transfer only the verified baseline installer to the read-only build job
        uses: actions/upload-artifact@v4
        with:
          name: flick-baseline-1.0.4-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/flick-upgrade-fixture/Flick-1.0.4-Setup.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  setup-preview:
    name: Compile unsigned Flick Setup and portable ZIP
    needs: fetch-preserved-upgrade-fixture
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the verified baseline from this workflow's isolated fetch job
        uses: actions/download-artifact@v4
        with:
          name: flick-baseline-1.0.4-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/flick-upgrade-fixture
      - name: Recheck the installer upgrade fixture before toolchain or build work
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = Join-Path (Join-Path $env:RUNNER_TEMP 'flick-upgrade-fixture') 'Flick-1.0.4-Setup.exe'
          if (-not (Test-Path -LiteralPath $baseline -PathType Leaf) -or
              (Get-Item -LiteralPath $baseline).Length -ne 241947803 -or
              (Get-FileHash -LiteralPath $baseline -Algorithm SHA256).Hash -cne 'DA1A0BBFB6B1D5803FC0D54387682C24F43D6039BAE6A2C999822628E7828A5F') {
            throw 'Preserved Flick 1.0.4 upgrade fixture is missing or its bytes changed'
          }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
      - name: Install reviewed Inno Setup 6.7.1 compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --version=6.7.1 --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup Chocolatey install failed" }
          $programFiles = [Environment]::GetFolderPath([Environment+SpecialFolder]::ProgramFilesX86)
          $iscc = Join-Path $programFiles 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw "ISCC.exe missing after pinned installation" }
      - name: Download and SHA-256 verify OBS and FFmpeg runtime assets
        shell: pwsh
        run: ./scripts/setup_tools.ps1
      - name: Build native capture host in qualified MSYS2 environment
        shell: msys2 {0}
        run: |
          test -f tools/obs/runtime/bin/64bit/obs.dll
          mkdir -p native-build
          windres -Isrc/LocalClip.CaptureHost src/LocalClip.CaptureHost/nativeversion.rc -O coff -o native-build/capture-version.o
          g++ -O2 -std=c++17 -static-libgcc -static-libstdc++ \
            -Itools/obs/include/libobs -Isrc/LocalClip.CaptureHost \
            src/LocalClip.CaptureHost/main.cpp native-build/capture-version.o \
            -Ltools/obs/runtime/bin/64bit -Wl,-Bstatic,--whole-archive -lwinpthread \
            -Wl,--no-whole-archive,-Bdynamic -lobs -ldwmapi -lole32 \
            -o tools/obs/runtime/bin/64bit/LocalClip.CaptureHost.exe
          test -f tools/obs/runtime/bin/64bit/LocalClip.CaptureHost.exe
      - name: Run offline source/design contracts
        shell: pwsh
        run: |
          ./scripts/check_gui_design.ps1
          ./scripts/check_gui_slice6.ps1
          ./scripts/check_flick_release_source.ps1
      - name: Build portable ZIP and conventional per-user Setup EXE
        shell: pwsh
        run: ./scripts/build_installer.ps1 -SkipNativeBuild
      - name: Check preview hashes and included tools
        shell: pwsh
        run: |
          ./scripts/verify_flick_release.ps1
          $checksums = 'dist/SHA256SUMS.txt'
          $setup = 'dist/Flick-Setup.exe'
          $portable = 'dist/Flick-v1.0.11-win-x64.zip'
          foreach ($path in @($checksums, $setup, $portable)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing $path" }
          }
          $manifest = Get-Content -LiteralPath $checksums -Raw
          foreach ($name in @('Flick.exe', 'Flick-v1.0.11-win-x64.zip',
                              'Flick-Setup.exe', 'LocalClip.CaptureHost.exe')) {
            if (-not $manifest.Contains($name)) { throw "Missing hash entry: $name" }
          }
          Write-Host "Unsigned preview compiled; no hardware acceptance is asserted."
      - name: Verify per-user install, update wait, restart and data retention
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = Join-Path (Join-Path $env:RUNNER_TEMP 'flick-upgrade-fixture') 'Flick-1.0.4-Setup.exe'
          if (-not (Test-Path -LiteralPath $baseline -PathType Leaf) -or
              (Get-Item -LiteralPath $baseline).Length -ne 241947803 -or
              (Get-FileHash -LiteralPath $baseline -Algorithm SHA256).Hash -cne 'DA1A0BBFB6B1D5803FC0D54387682C24F43D6039BAE6A2C999822628E7828A5F') {
            throw 'Previously verified Flick 1.0.4 upgrade fixture changed before the installer test'
          }
          ./scripts/test_flick_installer_update.ps1 -BaselineSetupPath $baseline
      - name: Upload installer lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flick-installer-evidence-${{ github.sha }}
          path: dist/installer-smoke/**
          if-no-files-found: warn
          retention-days: 14
      - name: Upload portable capture helper dependency and noncapture startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flick-portable-runtime-evidence-${{ github.sha }}
          path: dist/capture-runtime/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload unsigned preview files
        uses: actions/upload-artifact@v4
        with:
          name: flick-unsigned-preview-${{ github.sha }}
          path: |
            dist/Flick-Setup.exe
            dist/Flick-v1.0.11-win-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - name: Assemble separate silent-window qualification payload (no capture)
        shell: pwsh
        run: ./scripts/build_recording_qualification.ps1
      - name: Upload qualification payload and source/file hashes
        uses: actions/upload-artifact@v4
        with:
          name: flick-recording-qualification-${{ github.sha }}
          path: |
            dist/recording-qualification-*.zip
            dist/recording-qualification-*.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Assemble separate generated-process audio qualification payload (no playback or capture)
        shell: pwsh
        run: ./scripts/build_audio_qualification.ps1
      - name: Upload generated-process audio payload and source/file hashes
        uses: actions/upload-artifact@v4
        with:
          name: flick-audio-qualification-${{ github.sha }}
          path: |
            dist/audio-qualification-*.zip
            dist/audio-qualification-*.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

# PR artifact build only; GitHub Release publication is a separate reviewed workflow.
